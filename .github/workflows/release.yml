name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish (uses the installed .NET runtime)
        run: dotnet publish -c Release -o publish

      # Not compressed on purpose: a compressed single-file exe unpacks itself
      # into memory and uses ~45 MB more RAM. The zip keeps the download small.
      - name: Publish standalone (runtime included)
        run: dotnet publish -c Release --self-contained true -p:IncludeNativeLibrariesForSelfExtract=true -o standalone

      - name: Package standalone
        shell: pwsh
        run: Compress-Archive -Path standalone/LiteDrops.exe -DestinationPath LiteDrops-standalone-win-x64.zip

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" publish/LiteDrops.exe LiteDrops-standalone-win-x64.zip --title "LiteDrops ${{ github.ref_name }}" --generate-notes
